# Nginx 七层负载均衡配置
# 部署位置：node3（192.168.88.102）
# 完整操作步骤见 docs/02-操作手册/2.2-Nginx七层负载均衡.md
#
# 说明：upstream 必须定义在 http {} 层级；放在 /etc/nginx/conf.d/*.conf 里即可。
# 默认使用轮询（round-robin），便于观察后端切换效果。
# 需要会话保持时，去掉下面 ip_hash 的注释（更推荐把 Session 外置到 Redis）。

upstream web_cluster {
    # ip_hash;                                    # 会话保持：同一客户端 IP 固定落到同一台
    server 192.168.88.100:80 max_fails=3 fail_timeout=30s;
    server 192.168.88.101:80 max_fails=3 fail_timeout=30s;
    # server 192.168.88.102:8080 backup;           # 备用节点：前面全挂才启用
}

server {
    listen 80;
    server_name blog.example.com;

    location / {
        proxy_pass http://web_cluster;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
